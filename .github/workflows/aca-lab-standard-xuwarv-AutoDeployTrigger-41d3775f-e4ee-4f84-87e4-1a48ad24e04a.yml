name: Trigger auto deployment for aca-lab-standard-xuwarv

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/aca-lab-standard-xuwarv-AutoDeployTrigger-41d3775f-e4ee-4f84-87e4-1a48ad24e04a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ACALABSTANDARDXUWARV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ACALABSTANDARDXUWARV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ACALABSTANDARDXUWARV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.ACALABSTANDARDXUWARV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACALABSTANDARDXUWARV_REGISTRY_PASSWORD }}
          containerAppName: aca-lab-standard-xuwarv
          resourceGroup: rg-aca-lab-XUWARV
          imageToBuild: saraypeti/aca-lab-standard-xuwarv:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


